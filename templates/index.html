<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KULT — Access Gate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        .gate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 450px;
        }
        .logo-container {
            width: 280px;
            height: 280px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .logo-container:active {
            cursor: grabbing;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(138, 154, 91, 0.35));
            pointer-events: none;
        }
        .auth-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .btn {
            width: 100%;
            padding: 16px 0;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }
        .btn-primary {
            background-color: #8a9a5b;
            color: #0b0b0b;
            border-color: #8a9a5b;
        }
        .btn-primary:hover {
            background-color: #9ab068;
            box-shadow: 0 0 15px rgba(138, 154, 91, 0.4);
        }
        .btn-secondary {
            background-color: transparent;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            border-color: #8a9a5b;
            color: #8a9a5b;
        }
    </style>
</head>
<body>

    <div class="gate-container">
        <!-- Interactive Rotating GIF Container -->
        <div class="logo-container" id="interactiveLogo">
            <!-- Points to your newly generated infinite loop GIF -->
            <img src="/static/kult_logo.gif" alt="KULT Emblem" id="logoGif">
        </div>
        
        <!-- Authentication & Entry Actions -->
        <div class="auth-actions">
            <a href="/login" class="btn btn-primary">Login</a>
            <a href="/register" class="btn btn-secondary">Register</a>
        </div>
    </div>

    <script>
        // Touch and mouse feedback script for interactive rotation feel
        const container = document.getElementById('interactiveLogo');
        let startX = 0;

        container.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, {passive: true});

        container.addEventListener('touchmove', (e) => {
            let currentX = e.touches[0].clientX;
            let diff = currentX - startX;
            container.style.transform = `perspective(500px) rotateY(${diff * 0.5}deg)`;
        }, {passive: true});

        container.addEventListener('touchend', () => {
            container.style.transform = 'perspective(500px) rotateY(0deg)';
            container.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            let diff = e.clientX - startX;
            container.style.transform = `perspective(500px) rotateY(${diff * 0.5}deg)`;
            container.style.transition = 'none';
        }

        function onMouseUp() {
            container.style.transform = 'perspective(500px) rotateY(0deg)';
            container.style.transition = 'transform 0.5s ease';
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
        }
    </script>

</body>
</html>
