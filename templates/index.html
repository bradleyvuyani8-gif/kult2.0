<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KULT — Access Gate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .gate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 450px;
        }
        .logo-container {
            width: 280px;
            height: 280px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 6s ease-in-out infinite;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(138, 154, 91, 0.35));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }
        .auth-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .btn {
            width: 100%;
            padding: 16px 0;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }
        .btn-primary {
            background-color: #8a9a5b;
            color: #0b0b0b;
            border-color: #8a9a5b;
        }
        .btn-primary:hover {
            background-color: #9ab068;
            box-shadow: 0 0 15px rgba(138, 154, 91, 0.4);
        }
        .btn-secondary {
            background-color: transparent;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            border-color: #8a9a5b;
            color: #8a9a5b;
        }
    </style>
</head>
<body>

    <div class="gate-container">
        <!-- Floating Logo Focal Point -->
        <div class="logo-container">
            <img src="/static/kult_logo.png" alt="KULT Emblem">
        </div>
        
        <!-- Authentication & Entry Actions -->
        <div class="auth-actions">
            <a href="/login" class="btn btn-primary">Login</a>
            <a href="/register" class="btn btn-secondary">Register</a>
        </div>
    </div>

</body>
</html>
