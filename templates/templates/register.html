<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KULT — Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #121212;
            border: 1px solid #222;
            border-radius: 6px;
            text-align: center;
        }
        .logo-small {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #8a9a5b;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #888;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            border-color: #8a9a5b;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px 0;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            background-color: #8a9a5b;
            color: #0b0b0b;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #9ab068;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: #8a9a5b;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <img src="/static/kult_logo.gif" alt="KULT" class="logo-small">
        <h2>Initialize Membership</h2>
        
        <form method="POST">
            <div class="form-group">
                <label for="email">Email Identifier</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <a href="/" class="back-link">← Return to Gate</a>
    </div>

</body>
</html>
