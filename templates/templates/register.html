<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KULT — Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #e4ebf5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            background: #e4ebf5;
            box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff;
            border-radius: 16px;
            text-align: center;
        }
        .logo-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #555;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #e4ebf5;
            border: none;
            box-shadow: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff;
            color: #333;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff, 0 0 0 2px rgba(138, 154, 91, 0.3);
        }
        .btn {
            width: 100%;
            padding: 14px 0;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            background-color: #e4ebf5;
            color: #4a5d4e;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 5px 5px 10px #cbd5e1, -5px -5px 10px #ffffff;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn:active {
            box-shadow: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff;
        }
        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.8rem;
        }
        .nav-links a {
            color: #666;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a:hover {
            color: #4a5d4e;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-container">
            <img src="/static/kult_logo.gif" alt="KULT">
        </div>
        <h2>Create Account</h2>
        
        <form method="POST">
            <div class="form-group">
                <input type="text" name="fullname" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <div class="nav-links">
            <a href="/">← Gate</a>
            <a href="/login">Existing User?</a>
        </div>
    </div>
</body>
</html>
